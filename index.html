<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WeatherSphere Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
min-height:100vh;
font-family:Inter,system-ui,sans-serif;
background:linear-gradient(135deg,#071126,#102d6b,#1e40af);
display:flex;justify-content:center;align-items:center;
padding:20px;color:white;overflow:hidden
}
body::before{
content:"";position:fixed;inset:0;
background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.15),transparent 25%),
radial-gradient(circle at 80% 70%,rgba(255,255,255,.12),transparent 30%);
}
.card{
position:relative;
width:min(900px,100%);
backdrop-filter:blur(18px);
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
border-radius:28px;
padding:28px;
box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.top{display:flex;gap:12px;flex-wrap:wrap}
input{
flex:1;padding:14px 16px;border:none;border-radius:14px;
background:rgba(255,255,255,.12);color:white;font-size:16px
}
input::placeholder{color:#d6d6d6}
button{
padding:14px 18px;border:none;border-radius:14px;
cursor:pointer;font-weight:700
}
.primary{background:white;color:#0f172a}
.secondary{background:#2563eb;color:white}
.hidden{display:none}
.hero{
display:grid;
grid-template-columns:1.4fr 1fr;
gap:20px;margin-top:24px
}
.panel{
background:rgba(255,255,255,.06);
border-radius:22px;padding:22px
}
.temp{font-size:72px;font-weight:800}
.city{font-size:30px;font-weight:700}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:14px;margin-top:18px
}
.metric{
background:rgba(255,255,255,.07);
padding:18px;border-radius:18px
}
.metric h4{opacity:.7;margin-bottom:8px}
.metric p{font-size:22px;font-weight:700}
@media(max-width:700px){
.hero{grid-template-columns:1fr}
.temp{font-size:52px}
}
</style>
</head>
<body>
<div class="card">
<h1>🌤 WeatherSphere Pro</h1>
<p style="opacity:.8;margin-top:6px">Premium weather dashboard using live Open‑Meteo data.</p>

<div class="top" style="margin-top:18px">
<input id="city" placeholder="Search city...">
<button class="primary" onclick="searchCity()">Search</button>
<button class="secondary" onclick="useLocation()">Use My Location</button>
</div>

<div id="weather" class="hidden">
<div class="hero">
<div class="panel">
<div class="city" id="cityName"></div>
<div class="temp" id="temp"></div>
<div id="time" style="opacity:.8"></div>
</div>

<div class="panel">
<h2>Conditions</h2>
<div class="grid">
<div class="metric"><h4>Humidity</h4><p id="humidity"></p></div>
<div class="metric"><h4>Wind</h4><p id="wind"></p></div>
<div class="metric"><h4>Feels Like</h4><p id="apparent"></p></div>
<div class="metric"><h4>Elevation</h4><p id="elevation"></p></div>
</div>
</div>
</div>
</div>
</div>

<script>
async function renderWeather(lat,lon,name,elev="--"){
const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m&timezone=auto`;
const res=await fetch(url);
const data=await res.json();

document.getElementById("weather").classList.remove("hidden");
document.getElementById("cityName").textContent=name;
document.getElementById("temp").textContent=data.current.temperature_2m+"°C";
document.getElementById("humidity").textContent=data.current.relative_humidity_2m+"%";
document.getElementById("wind").textContent=data.current.wind_speed_10m+" km/h";
document.getElementById("apparent").textContent=data.current.apparent_temperature+"°C";
document.getElementById("elevation").textContent=elev+" m";
document.getElementById("time").textContent="Updated: "+data.current.time.replace("T"," ");
}

async function searchCity(){
const city=document.getElementById("city").value.trim();
if(!city) return;
const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
const g=await geo.json();
if(!g.results){alert("City not found");return;}
const r=g.results[0];
renderWeather(r.latitude,r.longitude,r.name,r.elevation||"--");
}

function useLocation(){
navigator.geolocation.getCurrentPosition(
p=>renderWeather(p.coords.latitude,p.coords.longitude,"Your Location"),
()=>alert("Location access denied")
);
}
</script>
</body>
</html>
